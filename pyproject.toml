[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evical"
version = "0.1.0"
description = "Evidence-sensitive confidence estimation for LLMs in medical question answering"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["torch", "transformers", "accelerate", "bitsandbytes", "numpy", "pandas", "scipy", "scikit-learn", "pyyaml"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
